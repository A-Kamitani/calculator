<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四則計算ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F7F6F2;
    --surface:   #FFFFFF;
    --border:    rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.22);
    --text:      #1C1C1E;
    --muted:     #6B6B6B;
    --accent:    #E85D3A;
    --accent-bg: rgba(232,93,58,0.07);
    --danger:    #C0392B;
    --radius-md: 8px;
    --radius-lg: 12px;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #111110;
      --surface:   #1C1C1E;
      --border:    rgba(255,255,255,0.10);
      --border-md: rgba(255,255,255,0.20);
      --text:      #F5F4F0;
      --muted:     #888780;
      --accent:    #E85D3A;
      --accent-bg: rgba(232,93,58,0.10);
      --danger:    #E05C5C;
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }

  .page {
    width: 100%;
    max-width: 680px;
  }

  .header {
    margin-bottom: 2rem;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
  }

  /* ── 計算エリア ── */
  .calc-row {
    display: grid;
    grid-template-columns: minmax(0,2fr) minmax(0,1fr) minmax(0,2fr) minmax(0,2fr);
    gap: 10px;
    align-items: end;
  }

  .field-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .num-input {
    width: 100%;
    height: 44px;
    font-family: var(--mono);
    font-size: 17px;
    padding: 0 12px;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    -moz-appearance: textfield;
  }
  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .num-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .op-select {
    width: 100%;
    height: 44px;
    font-size: 20px;
    text-align: center;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
    appearance: none;
  }
  .op-select:focus { border-color: var(--accent); }

  .result-box {
    width: 100%;
    height: 44px;
    font-family: var(--mono);
    font-size: 17px;
    padding: 0 12px;
    border: 0.5px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
  }
  .result-box.error { color: var(--danger); }
  .result-box.flash { animation: fadein .22s ease; }
  @keyframes fadein { from { opacity: .15 } to { opacity: 1 } }

  /* ── ボタン行 ── */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .btn {
    height: 36px;
    padding: 0 16px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .12s, transform .08s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg); }
  .btn:active { transform: scale(.97); }

  .btn-save {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-save:hover { background: var(--accent-bg); }

  .btn-edit.active {
    background: var(--bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── 区切り ── */
  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 1.25rem 0;
  }

  /* ── 履歴リスト ── */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history-item {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    animation: slidein .18s ease;
  }
  @keyframes slidein { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:translateY(0) } }

  .history-expr {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .history-result {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-left: auto;
    padding: 0 12px 0 16px;
  }
  .history-result.error { color: var(--danger); }

  .del-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0.5px solid var(--border-md);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
    transition: background .12s, color .12s;
  }
  .del-btn:hover { background: #fce8e8; color: var(--danger); }

  .empty-note {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 1rem 0;
  }

  /* ── SVG icons (inline) ── */
  .icon { width:15px; height:15px; vertical-align:-2px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ── Responsive ── */
  @media (max-width: 520px) {
    .calc-row { grid-template-columns: 1fr 60px 1fr; grid-template-rows: auto auto; }
    .result-col { grid-column: 1 / -1; }
    body { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="header">
    <h1>四則計算ツール</h1>
  </div>

  <div class="card">

    <!-- 計算エリア -->
    <div class="calc-row">
      <div>
        <div class="field-label">数値 A</div>
        <input class="num-input" type="number" id="numA" placeholder="0" autocomplete="off">
      </div>
      <div>
        <div class="field-label">演算子</div>
        <select class="op-select" id="op" aria-label="演算子">
          <option value="+">＋</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>
      <div>
        <div class="field-label">数値 B</div>
        <input class="num-input" type="number" id="numB" placeholder="0" autocomplete="off">
      </div>
      <div class="result-col">
        <div class="field-label">答え</div>
        <div class="result-box" id="result" role="status" aria-live="polite">—</div>
      </div>
    </div>

    <!-- ボタン行 -->
    <div class="btn-row">
      <button class="btn btn-save" id="saveBtn" title="現在の計算式を保存">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存
      </button>
      <button class="btn" id="clearABtn" title="数値Aのみ消去">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        Aのみクリア
      </button>
      <button class="btn" id="clearBtn" title="入力をすべて消去">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        全てクリア
      </button>
      <button class="btn btn-edit" id="editBtn" title="保存した履歴を編集">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        編集
      </button>
    </div>

    <div class="divider"></div>

    <!-- 履歴リスト -->
    <div class="history-list" id="historyList" aria-label="保存された計算履歴"></div>

  </div>
</main>

<script>
  const STORAGE_KEY = 'calc_history_v1';
  let editMode = false;
  let currentResult = null;
  let currentIsError = false;

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function saveHistory(h) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  }

  function formatNum(n) {
    const s = String(n);
    if (s.includes('e')) return Number(n).toFixed(10).replace(/\.?0+$/, '');
    const parts = s.split('.');
    if (parts[1] && parts[1].length > 10) {
      return Number(n).toPrecision(12).replace(/\.?0+$|(\.\d*?)0+$/, '$1');
    }
    return s;
  }

  function opSymbol(op) {
    return op === '+' ? '＋' : op === '-' ? '−' : op === '*' ? '×' : '÷';
  }

  function compute() {
    const a  = document.getElementById('numA').value;
    const b  = document.getElementById('numB').value;
    const op = document.getElementById('op').value;
    const box = document.getElementById('result');

    box.classList.remove('flash', 'error');
    void box.offsetWidth;

    if (a === '' || b === '') {
      box.textContent = '—';
      currentResult = null;
      currentIsError = false;
      return;
    }

    const na = parseFloat(a);
    const nb = parseFloat(b);

    if (isNaN(na) || isNaN(nb)) {
      box.textContent = 'エラー';
      box.classList.add('error', 'flash');
      currentIsError = true;
      return;
    }

    let res;
    switch (op) {
      case '+': res = na + nb; break;
      case '-': res = na - nb; break;
      case '*': res = na * nb; break;
      case '/':
        if (nb === 0) {
          box.textContent = 'エラー';
          box.classList.add('error', 'flash');
          currentIsError = true;
          return;
        }
        res = na / nb;
        break;
    }

    currentIsError = false;
    currentResult = res;
    box.textContent = formatNum(res);
    box.classList.add('flash');
  }

  function renderHistory() {
    const list = loadHistory();
    const container = document.getElementById('historyList');

    if (list.length === 0) {
      container.innerHTML = '<div class="empty-note">保存された計算式はありません</div>';
      return;
    }

    container.innerHTML = '';
    list.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'history-item';

      const expr = document.createElement('span');
      expr.className = 'history-expr';
      expr.textContent = item.expr;

      const result = document.createElement('span');
      result.className = 'history-result' + (item.isError ? ' error' : '');
      result.textContent = item.result;

      row.appendChild(expr);
      row.appendChild(result);

      if (editMode) {
        const btn = document.createElement('button');
        btn.className = 'del-btn';
        btn.title = 'この計算式を削除';
        btn.setAttribute('aria-label', `削除: ${item.expr} ${item.result}`);
        btn.innerHTML = '&minus;';
        btn.addEventListener('click', () => {
          const h = loadHistory();
          h.splice(idx, 1);
          saveHistory(h);
          renderHistory();
        });
        row.appendChild(btn);
      }

      container.appendChild(row);
    });
  }

  document.getElementById('numA').addEventListener('input', compute);
  document.getElementById('numB').addEventListener('input', compute);
  document.getElementById('op').addEventListener('change', compute);

  document.getElementById('saveBtn').addEventListener('click', () => {
    const a  = document.getElementById('numA').value;
    const b  = document.getElementById('numB').value;
    const op = document.getElementById('op').value;

    if (a === '' || b === '') return;
    if (currentResult === null && !currentIsError) return;

    const expr   = `${a} ${opSymbol(op)} ${b} =`;
    const result = currentIsError ? 'エラー' : formatNum(currentResult);
    const h = loadHistory();
    h.unshift({ expr, result, isError: currentIsError });
    saveHistory(h);
    renderHistory();
  });

  document.getElementById('clearABtn').addEventListener('click', () => {
    document.getElementById('numA').value = '';
    compute();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('numA').value = '';
    document.getElementById('numB').value = '';
    document.getElementById('op').value   = '+';
    const box = document.getElementById('result');
    box.textContent = '—';
    box.classList.remove('error', 'flash');
    currentResult  = null;
    currentIsError = false;
  });

  document.getElementById('editBtn').addEventListener('click', () => {
    editMode = !editMode;
    document.getElementById('editBtn').classList.toggle('active', editMode);
    renderHistory();
  });

  compute();
  renderHistory();
</script>
</body>
</html>
